# Job Monitor Configuration
# Copy this to config.local.yaml and fill in your credentials

# Gmail SMTP Settings
email:
  smtp_server: "smtp.gmail.com"
  smtp_port: 587
  sender_email: "your_email@gmail.com"      # Your Gmail address
  sender_password: "your_app_password"      # Gmail App Password (not regular password)
  recipient_email: "your_email@gmail.com"   # Where to send notifications (can be same)

# Job Search Settings
job_search:
  # Primary location: Abuja
  location: "Abuja"
  # Also search for remote jobs
  remote_keywords:
    - "remote"
    - "work from home"
    - "wfh"
    - "fully remote"
    - "distributed team"
  keywords:
    - "developer"
    - "software engineer"
    - "frontend"
    - "backend"
    - "fullstack"
    - "full stack"
    - "python"
    - "javascript"
    - "react"
    - "node"
    - "java"
    - "c#"
    - ".net"
    - "internship"
    - "graduate"
    - "entry level"
    - "junior"
    - "trainee"
    - "devops"
    - "data analyst"
    - "data scientist"
    - "mobile developer"
    - "flutter"
    - "kotlin"
    - "swift"
  exclude_keywords:
    - "senior"
    - "lead"
    - "principal"
    - "architect"
    - "manager"
    - "director"
    - "vp"
    - "head of"

# Job Sites to Monitor (enabled/disabled)
# LinkedIn only for now (best for tech roles, has remote filter)
job_sites:
  linkedin: true
  myjobmag: false
  jobberman: false
  indeed: false
  ngcareers: false
  hotnigerianjobs: false

# Monitoring Settings
monitoring:
  check_interval_minutes: 30
  max_jobs_per_site: 20
  days_back: 3  # Only show jobs posted within this many days (1 sec to 3 days)

# GitHub Actions Settings
github_actions:
  enabled: true
  schedule: "0 */2 * * *"  # Every 2 hours at minute 0 (cron expression)